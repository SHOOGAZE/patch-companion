<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0D0E0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Patch Companion">
<title>Patch Companion</title>
<!-- Patch Companion: patch card generator for the Sequential Take 5. MIT, (c) Kirill Kinderhart. Design language shared with Producer Companion and Sequential Companion. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one instrument panel. Dial strip on top shows the active module, bottom key bar switches modules,
   each module is a control card (keys, slider, go-button) above a dark-headed readout sheet. */
:root{
  --bg:#D4D5D2; --panel:#E2E3E0; --ink:#1A1B1A; --ink2:#575A56; --line:#A6A8A4; --line2:#C4C6C2;
  --key:#CFD0CC; --key-top:#EDEEEB; --key-sh:#9C9E9A;
  --screen:#131413; --screen-ink:#E6E7E3; --screen-dim:#9A9D98;
  --on-ink:#E8E9E6; --lamp:#E8461B; --lamp-off:#8C8E8A;
  --tex:repeating-linear-gradient(90deg,rgba(0,0,0,.022) 0 1px,transparent 1px 3px);
  --f-ui:'IBM Plex Sans Condensed','Arial Narrow',system-ui,'Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,'Hiragino Sans','Yu Gothic','Noto Sans JP',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111211; --panel:#1B1C1B; --ink:#E4E5E1; --ink2:#A0A39E; --line:#3A3C39; --line2:#2A2C2A;
    --key:#272927; --key-top:#3B3D3A; --key-sh:#0A0B0A;
    --screen:#0A0B0A; --screen-ink:#E6E7E3; --screen-dim:#8E918C;
    --on-ink:#141514; color-scheme:dark; --tex:none;
  }
}
:root[data-theme="dark"]{
  --tex:none;
  --bg:#111211; --panel:#1B1C1B; --ink:#E4E5E1; --ink2:#A0A39E; --line:#3A3C39; --line2:#2A2C2A;
  --key:#272927; --key-top:#3B3D3A; --key-sh:#0A0B0A;
  --screen:#0A0B0A; --screen-ink:#E6E7E3; --screen-dim:#8E918C;
  --on-ink:#141514; color-scheme:dark;
}
/* manual skins, chosen with the header button; default is automatic */
:root[data-skin="white"]{
  --tex:none;
  --bg:#FFFFFF; --panel:#F5F5F4; --ink:#111211; --ink2:#5A5C59; --line:#BEC0BC; --line2:#E0E1DE;
  --key:#ECEDEB; --key-top:#FFFFFF; --key-sh:#B4B6B2;
  --screen:#131413; --screen-ink:#E6E7E3; --screen-dim:#9A9D98;
  --on-ink:#F4F5F2; color-scheme:light;
}
:root[data-skin="grey"]{
  --bg:#D4D5D2; --panel:#E2E3E0; --ink:#1A1B1A; --ink2:#575A56; --line:#A6A8A4; --line2:#C4C6C2;
  --key:#CFD0CC; --key-top:#EDEEEB; --key-sh:#9C9E9A;
  --screen:#131413; --screen-ink:#E6E7E3; --screen-dim:#9A9D98;
  --on-ink:#E8E9E6; color-scheme:light;
}
:root[data-skin="dark"]{
  --tex:none;
  --bg:#111211; --panel:#1B1C1B; --ink:#E4E5E1; --ink2:#A0A39E; --line:#3A3C39; --line2:#2A2C2A;
  --key:#272927; --key-top:#3B3D3A; --key-sh:#0A0B0A;
  --screen:#0A0B0A; --screen-ink:#E6E7E3; --screen-dim:#8E918C;
  --on-ink:#141514; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg) var(--tex);color:var(--ink);font:14px/1.45 var(--f-ui);
  padding-block:12px 112px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,select,input{font:inherit;color:inherit}
.device{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
/* header + dial stay pinned so you always see where you are */
.stick{position:sticky;top:0;z-index:25;display:flex;flex-direction:column;gap:14px;background:var(--bg);margin:0 -4px;padding:max(8px,env(safe-area-inset-top,0px)) 4px 10px;box-shadow:0 1px 0 var(--line2)}
.mono{font-family:var(--f-mono)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{flex:none;display:flex;align-items:center;color:var(--ink)}
.mark svg{display:block;width:46px;height:auto}
.wm{display:flex;min-width:0;color:var(--ink)}
.wm .nm{display:block;height:28px;width:auto}
.meter{display:flex;align-items:center;gap:8px;flex:none}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--lamp-off);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);transition:background .08s,box-shadow .08s}
.lamp.on{background:var(--lamp);box-shadow:0 0 0 1px rgba(0,0,0,.2),0 0 10px 2px color-mix(in srgb,var(--lamp) 60%,transparent)}
.counter{font:500 13px/1 var(--f-mono);background:var(--screen);color:var(--screen-ink);padding:6px 7px;border-radius:2px;letter-spacing:.12em}

/* dial */
.dial{position:relative;flex:1;min-width:0;height:50px;background:var(--panel);border:1px solid var(--line);border-radius:3px;overflow:hidden;--pos:16.67%}
.dial .sw{position:absolute;inset:0 12px}
.dial .minor,.dial .major{position:absolute;left:0;right:0;bottom:0;border-right:1px solid var(--ink2)}
.dial .minor{height:7px;background:repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 2.5%)}
.dial .major{height:14px;background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 10%)}
.dial .dl{position:absolute;top:8px;transform:translateX(-50%);font:600 9.5px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);white-space:nowrap;transition:color .2s}
.dial .dl.on{color:var(--ink)}
.dial .needle{position:absolute;top:21px;bottom:0;width:2px;margin-left:-1px;left:var(--pos);background:var(--lamp);transition:left .38s cubic-bezier(.3,1.35,.5,1)}
.dial.scan .needle{animation:scan .7s ease-in-out}
@keyframes scan{0%{transform:translateX(0)}20%{transform:translateX(-44px)}55%{transform:translateX(52px)}80%{transform:translateX(-14px)}100%{transform:translateX(0)}}

/* dial row */
.dialrow{display:flex;gap:6px;align-items:stretch}
/* modules */
.mod{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 1px 0 var(--key-top),0 1px 0 var(--line2)}
.grp{display:flex;flex-direction:column;gap:8px}
.cap{display:flex;align-items:center;gap:10px;font:600 10.5px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.cap::after{content:"";flex:1;height:1px;background:var(--line)}
.cap em{font-style:normal;color:var(--ink);font-family:var(--f-mono);letter-spacing:.04em;order:2;margin-left:auto}
.cap em+*{order:3}
.cap::after{order:1}
.capb{width:100%;min-height:28px;padding:0;border:0;background:none;text-align:left;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.capb i{order:3;flex:none;display:flex;width:26px;justify-content:center;transition:transform .15s}
.capb[aria-expanded="true"] i{transform:rotate(180deg)}
.fb{display:flex;flex-direction:column;gap:10px}
.grid3,.grid4{display:grid;gap:6px}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.note{font-size:12px;color:var(--ink2);margin:0}

/* keys */
.key{
  position:relative;display:flex;align-items:center;justify-content:center;text-align:center;gap:6px;
  min-height:44px;padding:8px 6px;border:1px solid var(--line);border-radius:3px;background:var(--key);color:var(--ink);
  font:600 12px/1.1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;cursor:pointer;
  box-shadow:inset 0 1px 0 var(--key-top),0 1px 0 var(--key-sh);
  transition:transform .06s,background .08s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.key:active{transform:translateY(1px);box-shadow:inset 0 1px 3px var(--key-sh)}
.key[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink);box-shadow:inset 0 1px 3px rgba(0,0,0,.55)}
.key[aria-pressed="true"]::before{content:"";position:absolute;top:5px;left:5px;width:4px;height:4px;border-radius:50%;background:var(--on-ink)}
.key:focus-visible,.ib:focus-visible,.go:focus-visible,select:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}
.seg .key{border-radius:0;margin-left:-1px}
.seg .key:first-child{border-radius:3px 0 0 3px;margin-left:0}
.seg .key:last-child{border-radius:0 3px 3px 0}
.seg .key[aria-pressed="true"]{z-index:1}
.go{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;
  background:var(--ink);color:var(--on-ink);border:1px solid var(--ink);border-radius:3px;
  font:700 13.5px/1.1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 2px 0 var(--key-sh);touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.go:active{transform:translateY(1px);box-shadow:0 1px 0 var(--key-sh)}
.go .led{width:8px;height:8px;border-radius:50%;background:var(--lamp-off);transition:background .08s}
.go.busy .led{background:var(--lamp)}
.go{position:relative}
.go .seq{position:absolute;left:14px;right:14px;bottom:6px;display:flex;gap:2px;pointer-events:none}
.go .seq i{flex:1;height:4px;background:rgba(255,255,255,.13);border-radius:1px}
.go .seq i:nth-child(4n+1){background:rgba(255,255,255,.26)}
.go .seq i:nth-child(4n){margin-right:5px}
.go .seq i:last-child{margin-right:0}
.go .seq i.on{background:var(--lamp);box-shadow:0 0 5px var(--lamp)}
.ib{
  flex:none;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:3px;background:var(--key);color:var(--ink);cursor:pointer;
  box-shadow:inset 0 1px 0 var(--key-top),0 1px 0 var(--key-sh);touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.ib:active{transform:translateY(1px)}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.ib.dk{background:transparent;border-color:#3a3d39;color:var(--screen-ink);box-shadow:none}
.ib svg{display:block}

/* lcd + slider */
.lcd{background:var(--screen);color:var(--screen-ink);border-radius:3px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.lcd .big{font:500 46px/1 var(--f-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lcd .unit{font:500 11px/1 var(--f-mono);color:var(--screen-dim);letter-spacing:.14em;margin-left:6px}
.lcd .side{text-align:right;font:400 11px/1.5 var(--f-mono);color:var(--screen-dim)}
.step{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:6px}
.step .lcd{justify-content:center;padding:6px 10px}
.step .lcd .big{font-size:28px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--ink);border-radius:0}
input[type=range]::-moz-range-track{height:3px;background:var(--ink);border-radius:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:30px;margin-top:-13.5px;border:1px solid var(--ink);border-radius:2px;background:linear-gradient(90deg,transparent 8px,var(--ink) 8px 10px,transparent 10px),var(--key);box-shadow:inset 0 1px 0 var(--key-top),0 1px 2px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:16px;height:28px;border:1px solid var(--ink);border-radius:2px;background:linear-gradient(90deg,transparent 7px,var(--ink) 7px 9px,transparent 9px),var(--key);box-shadow:inset 0 1px 0 var(--key-top),0 1px 2px rgba(0,0,0,.35)}
.ticks{position:relative;height:26px;margin:0 9px}
.ticks::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;border-right:1px solid var(--ink2);background:repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px calc(100%/14))}
.ticks span{position:absolute;top:11px;transform:translateX(-50%);font:500 10px/1 var(--f-mono);color:var(--ink2)}
.t5{display:flex;justify-content:space-between;margin:0 9px}
.t5 i{width:1px;height:8px;background:var(--ink2)}
.t5l{display:flex;justify-content:space-between;font:500 10px/1 var(--f-mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.sel{position:relative}
.sel select{-webkit-appearance:none;appearance:none;width:100%;min-height:44px;padding:8px 36px 8px 12px;border:1px solid var(--line);border-radius:3px;background:var(--key);color:var(--ink);font:600 13px/1.1 var(--f-ui);letter-spacing:.07em;text-transform:uppercase;box-shadow:inset 0 1px 0 var(--key-top),0 1px 0 var(--key-sh)}
.sel::after{content:"";position:absolute;right:15px;top:50%;width:6px;height:6px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* output sheets */
.out{display:block}
.out.busy{opacity:.3;transition:opacity .1s}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 1px 0 var(--line2)}
.sheet-h{background:var(--screen);color:var(--screen-ink);padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.sheet-h .id{display:flex;justify-content:space-between;gap:12px;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;color:var(--screen-dim);text-transform:uppercase}
.sheet-h h2{margin:0;font:600 20px/1.2 var(--f-mono);letter-spacing:-.01em;text-transform:uppercase;overflow-wrap:anywhere;min-width:0}
.sheet-h .sub{font:400 12px/1.5 var(--f-mono);color:var(--screen-dim);overflow-wrap:anywhere}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font:500 10.5px/1 var(--f-mono);border:1px solid #3a3d39;color:var(--screen-ink);padding:4px 6px;border-radius:2px;letter-spacing:.04em;text-transform:uppercase}
.sec{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:minmax(86px,32%) minmax(0,1fr);gap:4px 12px;padding:8px 0 0;border-top:1px solid var(--line2)}
.kv .k{font:600 10.5px/1.6 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.kv .v{margin:0;overflow-wrap:anywhere;min-width:0;display:flex;flex-direction:column;gap:3px}
.kv .v.m{font:500 12.5px/1.5 var(--f-mono)}
.gh{font:600 10.5px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);padding:10px 0 2px;border-bottom:1px solid var(--ink)}
.gh:first-of-type{padding-top:0}
.strip{display:flex;gap:2px;height:20px}
.strip>div{min-width:0;position:relative;overflow:hidden;background:var(--line2)}
.strip i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform .34s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*60ms)}
.strip>div:nth-child(even) i{opacity:.45}
.letters{display:flex;gap:2px;font:500 10px/1 var(--f-mono);color:var(--ink2)}
.letters div{min-width:0;overflow:hidden}
.mb{height:3px;background:var(--line2);margin-top:4px}
.mb i{display:block;height:100%;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform .34s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0)*45ms)}
.in .strip i,.in .mb i{transform:scaleX(1)}
.frow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:8px 0 2px;border-top:1px solid var(--line2)}
.frow .L{font:600 12px/1.4 var(--f-mono);color:var(--ink2)}
.frow .fh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px}
.frow .fh b{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.frow .fh span{font:500 11.5px/1.5 var(--f-mono);color:var(--ink2)}
.frow p{margin:3px 0 0;color:var(--ink);font-size:13.5px}
.total{display:flex;justify-content:space-between;gap:10px;font:500 12px/1.4 var(--f-mono);border-top:1px solid var(--ink);padding-top:8px}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:14px;border-top:1px solid var(--line)}
.acts .key{gap:8px}

/* names */
.alias{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line2)}
.alias .nm{font:600 18px/1.25 var(--f-mono);overflow-wrap:anywhere;min-width:0}
.trk{display:grid;grid-template-columns:24px minmax(0,1fr) 36px;gap:10px;padding:10px 0;border-top:1px solid var(--line2);align-items:start}
.trk .n{font:500 12px/1.9 var(--f-mono);color:var(--ink2)}
.trk .t{font:600 15px/1.35 var(--f-mono);overflow-wrap:anywhere}
.trk .meta{display:flex;flex-wrap:wrap;gap:2px 12px;font:500 11.5px/1.5 var(--f-mono);color:var(--ink2);margin-top:2px}
.fld{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:2px 8px;padding:10px 0 4px;border-top:1px solid var(--line2)}
.fld .k{font:600 10.5px/1.6 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.fld .v{grid-column:1;margin:0;font-size:15px;line-height:1.5;display:block}
.fld .ib{grid-column:2;grid-row:1/3;align-self:start}

/* nav + toast */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar>div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bar .key{min-height:48px;flex-direction:column;gap:3px}
.bar .key small{font:500 10px/1 var(--f-mono);opacity:.7;letter-spacing:.08em}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);z-index:30;background:var(--ink);color:var(--on-ink);font:500 12px/1 var(--f-mono);padding:9px 12px;border-radius:3px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot{font:400 11px/1.5 var(--f-mono);color:var(--ink2);text-align:center;margin:2px 0 0}

/* wipe-in for prose */
@keyframes wipe{from{clip-path:inset(0 100% 0 0);opacity:.2}to{clip-path:inset(0 0 0 0);opacity:1}}
.anim .wipe,.w-now{animation:wipe .38s ease-out both;animation-delay:calc(var(--i,0)*28ms)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:360px){
    .lcd .big{font-size:40px}
  .dial .dl{font-size:7.5px;letter-spacing:-.02em}
  .tools{gap:4px}
  .mark svg{width:38px}
  .wm .nm{height:23px}
}

/* ===== header, counter window, wide layouts, boot screen ===== */
:root{--b-bg:var(--bg);--b-ink:var(--ink);--b-dim:var(--ink2);--b-line:var(--line);--w-ink:var(--screen-ink);--w-dim:var(--screen-dim);--w-line:#2B2D2A}
.tools{display:flex;gap:6px}
html[lang="ja"] body *{letter-spacing:.02em!important}
#langBtn{font:600 11px/1 var(--f-mono);letter-spacing:.04em}
.lw{position:relative}

<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=(n,l=2)=>String(n).padStart(l,'0');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============ PATCH ENGINE: Sequential Take 5 (draft v0.2) ============
   Values are knob positions 0..10 (5 = noon). The filter envelope knob is bipolar:
   5 = zero, above 5 = positive. Rules are a first draft; tune them by ear on the synth.
   A card also carries an 8x16 "meter matrix" (tracks) so the shell animations keep working. */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const GENRES=['pad','bass','lead','pluck','keys','drone','fx'];
const isMono=t=>t==='bass'||t==='lead';
/* mood presets: positions of brightness, movement, grit, space */
const MOODS=[{k:'warm',ru:'Тёплый',en:'Warm',o:[3,4,2,6]},{k:'dark',ru:'Тёмный',en:'Dark',o:[1,3,4,5]},{k:'bright',ru:'Яркий',en:'Bright',o:[8,4,2,5]},
  {k:'dreamy',ru:'Сонный',en:'Dreamy',o:[5,7,0,9]},{k:'dirty',ru:'Грязный',en:'Dirty',o:[5,5,9,3]},{k:'aggr',ru:'Злой',en:'Aggressive',o:[7,6,9,2]},
  {k:'calm',ru:'Спокойный',en:'Calm',o:[4,2,0,6]},{k:'evolve',ru:'Живой',en:'Evolving',o:[5,10,2,6]},{k:'dry',ru:'Сухой',en:'Dry',o:[5,3,3,0]}];
const OPT_KEYS=['brightness','movement','grit','space'];
const ROWS=['SHAPE','OSC2','SUB','CUT','RES','ENV','ATK','VERB'];
const clampN=(v,lo=0,hi=10)=>Math.min(hi,Math.max(lo,v));
const f1=v=>(Math.round(v*10)/10).toFixed(1);

const RULES={
  pad:{
    osc1Shape:[3.5,6.5],osc2Shape:[3,7],osc2Pitch:[5.3,6.4],sync:0,fm:[0,1.5],
    mixOsc1:[6,8],mixOsc2:[5,8],mixSub:[0,3],mixNoise:[0,1],
    cutoff:[3.5,6.5],reso:[1,4],drive:[0,2],envAmt:[1,4],
    fA:[3,7],fD:[4,8],fS:[4,7],fR:[5,9],aA:[3,7.5],aD:[4,8],aS:[6,9],aR:[6,9.5],
    lfoRate:[1,3],lfoShapes:['triangle'],lfoDest:[['cutoff',[.5,2.5]],['osc shape',[.5,2]]],
    reverb:[4,8],vintage:[2,6],glide:[0,0],unison:[[1,'off'],[.2,'2 voices']]
  },
  bass:{
    osc1Shape:[5,8],osc2Shape:[5,8],osc2Pitch:[4.9,5.4],sync:.1,fm:[0,1],
    mixOsc1:[6,8],mixOsc2:[2,6],mixSub:[5,8],mixNoise:[0,0],
    cutoff:[1.5,4],reso:[2,5],drive:[2,5],envAmt:[3,5],
    fA:[0,.3],fD:[2,4.5],fS:[0,2.5],fR:[1,3],aA:[0,.2],aD:[3,6],aS:[6,9],aR:[1,3],
    lfoRate:[1,4],lfoShapes:['triangle','square'],lfoDest:[['cutoff',[0,1.5]]],
    reverb:[0,1.5],vintage:[1,3],glide:[0,3],unison:[[.6,'mono, 1 voice'],[.4,'2 voices']]
  },
  lead:{
    osc1Shape:[4,8],osc2Shape:[4,8],osc2Pitch:[5.1,5.7],sync:.25,fm:[0,2],
    mixOsc1:[6,8],mixOsc2:[4,7],mixSub:[0,3],mixNoise:[0,0],
    cutoff:[4.5,8],reso:[2,5],drive:[1,3],envAmt:[2,5],
    fA:[0,.5],fD:[2,5],fS:[3,7],fR:[1.5,4],aA:[0,.3],aD:[3,6],aS:[6,9],aR:[1.5,3.5],
    lfoRate:[3,6],lfoShapes:['triangle','square'],lfoDest:[['cutoff',[0,1.5]],['osc shape',[.5,2]]],
    reverb:[1,4],vintage:[2,5],glide:[1,5],unison:[[.5,'mono, 1 voice'],[.5,'2 voices']]
  },
  pluck:{
    osc1Shape:[4,8],osc2Shape:[3,7],osc2Pitch:[5,5.8],sync:0,fm:[0,2],
    mixOsc1:[6,8],mixOsc2:[3,6],mixSub:[0,3],mixNoise:[0,1],
    cutoff:[3,6],reso:[1,4],drive:[0,2],envAmt:[3.5,5],
    fA:[0,.2],fD:[1,3],fS:[0,1],fR:[1,3],aA:[0,.1],aD:[1.5,3.5],aS:[0,1.5],aR:[1.5,4],
    lfoRate:[1,3],lfoShapes:['triangle'],lfoDest:[['cutoff',[0,1]]],
    reverb:[2,6],vintage:[1,4],glide:[0,0],unison:[[1,'off']]
  },
  keys:{
    osc1Shape:[2,5],osc2Shape:[2,6],osc2Pitch:[5,5.2],sync:0,fm:[0,.5],
    mixOsc1:[6,8],mixOsc2:[2,5],mixSub:[0,2],mixNoise:[0,.3],
    cutoff:[4,6.5],reso:[0,2],drive:[0,1.5],envAmt:[1.5,3.5],
    fA:[0,.2],fD:[3,6],fS:[2,5],fR:[2,4],aA:[0,.1],aD:[4,7],aS:[3,6],aR:[2,4.5],
    lfoRate:[2,4],lfoShapes:['triangle'],lfoDest:[['cutoff',[0,1]],['osc shape',[0,1]]],
    reverb:[2,5],vintage:[3,7],glide:[0,0],unison:[[1,'off']]
  },
  drone:{
    osc1Shape:[3,7],osc2Shape:[3,7],osc2Pitch:[5,5.4],sync:0,fm:[0,3],
    mixOsc1:[6,8],mixOsc2:[5,8],mixSub:[3,6],mixNoise:[0,2],
    cutoff:[2.5,5.5],reso:[1,4],drive:[1,3],envAmt:[0,2],
    fA:[6,9],fD:[6,9],fS:[6,9],fR:[6,9],aA:[6,9.5],aD:[6,9],aS:[8,10],aR:[7,10],
    lfoRate:[.5,2],lfoShapes:['triangle'],lfoDest:[['cutoff',[1.5,4]],['osc shape',[1,3]]],
    reverb:[6,9.5],vintage:[4,8],glide:[0,0],unison:[[.5,'2 voices'],[.5,'off']]
  },
  fx:{
    osc1Shape:[6,10],osc2Shape:[6,10],osc2Pitch:[3,7],sync:.5,fm:[3,8],
    mixOsc1:[3,6],mixOsc2:[3,7],mixSub:[0,2],mixNoise:[5,9],
    cutoff:[2,5],reso:[4,8],drive:[2,5],envAmt:[4,5],
    fA:[5,9],fD:[4,8],fS:[4,8],fR:[4,8],aA:[3,7],aD:[4,8],aS:[6,9],aR:[5,9],
    lfoRate:[4,8],lfoShapes:['square','triangle'],lfoDest:[['cutoff',[3,6]],['osc shape',[2,5]]],
    reverb:[4,8],vintage:[2,6],glide:[0,4],unison:[[.6,'off'],[.4,'2 voices']]
  }
};
const WORDS={
  pad:{a:['SLOW','AMBER','GLASS','DUSK','HAZE','WARM','MOSS','TIDE','PALE','FELT','ASH','NORTH'],n:['CHOIR','DRIFT','BLOOM','FIELD','HALO','VEIL','LIGHT','ROOM','SWELL','WASH']},
  bass:{a:['DEEP','IRON','COLD','HEAVY','DRY','RUBBER','LOW','TAR','STONE','BLUNT'],n:['PUSH','STAB','ROLL','THUD','GROWL','PULSE','TRUNK','SLAB','HUM']},
  lead:{a:['SHARP','BRIGHT','THIN','SOLO','SILK','BITE','NEON','CLEAR','HOT','WIRY'],n:['LINE','CRY','SPIKE','VOICE','FLAME','ARC','CALL','SWEEP','EDGE']},
  pluck:{a:['GLASS','DRY','TINY','WOOD','SHORT','BRIGHT','SOFT','DUST','COPPER','LIGHT'],n:['PLUCK','DROP','TICK','HARP','BELL','PEARL','SNAP','STRING','PING']},
  keys:{a:['WARM','OLD','SOFT','MELLOW','PAPER','VELVET','DUSTY','ROUND','QUIET','TAPE'],n:['KEYS','CHORD','ORGAN','PIANO','STAB','TONE','BELLS','LOUNGE','HALL']},
  drone:{a:['DEEP','LONG','STILL','IRON','SLOW','BLACK','WIDE','COLD','NIGHT','VAST'],n:['DRONE','HUM','FIELD','TIDE','MASS','CHORD','SHORE','CLOUD','WALL']},
  fx:{a:['WILD','RISING','BROKEN','STATIC','LASER','DIRTY','WET','FALLING','SHARP','NOISY'],n:['RISER','SWEEP','ZAP','SIREN','BLAST','FALL','WHOOSH','GLITCH','HISS']}
};

const packOpts=o=>{let n=0;OPT_KEYS.forEach(k=>{const v=o&&o[k]!=null?o[k]:5;n=n*11+Math.round(clampN(v));});return n.toString(36).toUpperCase().padStart(3,'0');};
function unpackOpts(s){let n=parseInt(s,36);const o={};if(!isFinite(n))return null;for(let i=OPT_KEYS.length-1;i>=0;i--){o[OPT_KEYS[i]]=n%11;n=Math.floor(n/11);}return o;}
const mkCode=(gi,seed,o,syn)=>(syn||'T5')+'-'+gi.toString(36).toUpperCase()+seed.toString(36).toUpperCase().padStart(5,'0')+packOpts(o);
function parseCode(s){
  const m=String(s).trim().match(/^(?:([A-Z0-9]{2})-)?([0-9A-Z])([0-9A-Z]{5})([0-9A-Z]{3})?$/i);if(!m)return null;
  const syn=(m[1]||'T5').toUpperCase();if(!SYN[syn])return null;const gi=parseInt(m[2],36),seed=parseInt(m[3],36);
  if(!(gi<GENRES.length)||!isFinite(seed))return null;
  return {syn,gi,seed,opts:m[4]?unpackOpts(m[4]):null};
}

function roundAll(o){for(const k in o){if(k==='rc'||k==='rm1'||k==='rm2'||k==='rm3')continue;if(typeof o[k]==='number')o[k]=Math.round(clampN(o[k])*10)/10;else if(o[k]&&typeof o[k]==='object')roundAll(o[k]);}return o;}

/* Dependencies: keep the result playable, not just random. */
function fix(p){
  if(p.cutoff<4.5)p.filterEnvAmt=Math.max(p.filterEnvAmt,7.5);          /* a closed filter must be opened by the envelope */
  if(p.reso>3.5){p.cutoff=Math.max(p.cutoff,4.5);p.drive=Math.min(p.drive,1);} /* high resonance needs room and less drive */
  if(p.ampEnv.a>6)p.ampEnv.r=Math.max(p.ampEnv.r,p.ampEnv.a-1);          /* slow attacks need a release that keeps the tail */
  const sum=p.mixOsc1+p.mixOsc2+p.mixSub;                                 /* mixer headroom */
  if(sum>17){const k=17/sum;p.mixOsc1*=k;p.mixOsc2*=k;p.mixSub*=k;}
  if(p.sync){p.osc2Pitch=Math.max(p.osc2Pitch,6.5);p.fm=Math.min(p.fm,.8);} /* sync wants a clearly offset osc 2; keep FM tame with it */
  p.filterEnvAmt=clampN(p.filterEnvAmt,5,10);                             /* positive side of the bipolar knob */
  return p;
}

/* 8 LED meters x 16 steps: the card as the shell animations see it. */
function matrix(p){
  const vals=[p.osc1Shape,p.osc2Shape,p.mixSub,p.cutoff,p.reso,(p.filterEnvAmt-5)*2,p.ampEnv.a,p.reverb];
  return vals.map((v,i)=>{
    const n=Math.round(clampN(v)*1.6),steps=[];
    for(let k=0;k<16;k++)steps.push({v:k<n?(k===n-1?118:92):0,c:'',p:null});
    return {name:ROWS[i],steps};
  });
}


/* ============ FM family: one abstract recipe, mapped to each FM panel by its view ============ */
const FMR={
  pad:{cls:[[.45,'twin'],[.3,'stack'],[.25,'deep']],rm1:[1,2,.5],rm2:[1,2,3],rm3:[1,2],i1:[2,5],i2:[2,5],i3:[1,4],fb:[0,3],det:[1,4],
    mA:[3,7],mD:[4,8],mS:[3,6],mR:[4,8],cA:[3,7.5],cD:[4,8],cS:[6,9],cR:[6,9.5],lr:[1,3],la:[.5,2.5],ld:'index',sp:[4,8],ct:[5,8]},
  bass:{cls:[[.6,'stack'],[.4,'deep']],rm1:[1,2],rm2:[1,2],rm3:[1,3],i1:[4,7],i2:[3,6],i3:[2,5],fb:[2,5],det:[0,1],
    mA:[0,.2],mD:[2,4.5],mS:[0,2],mR:[1,3],cA:[0,.2],cD:[3,6],cS:[6,9],cR:[1,3],lr:[1,4],la:[0,1.5],ld:'index',sp:[0,1.5],ct:[3,6]},
  lead:{cls:[[.5,'stack'],[.25,'twin'],[.25,'deep']],rm1:[1,2,3],rm2:[1,2,3],rm3:[1,2],i1:[4,8],i2:[3,6],i3:[2,5],fb:[1,4],det:[0,2],
    mA:[0,.3],mD:[3,6],mS:[4,8],mR:[2,4],cA:[0,.3],cD:[3,6],cS:[6,9],cR:[1.5,3.5],lr:[3,6],la:[.5,2],ld:'pitch',sp:[1,4],ct:[5,8]},
  pluck:{cls:[[.6,'stack'],[.4,'twin']],rm1:[1,2,3,4,5,7],rm2:[2,3,4],rm3:[1,2],i1:[5,8],i2:[3,6],i3:[1,4],fb:[0,3],det:[0,1],
    mA:[0,.1],mD:[1,2.5],mS:[0,.5],mR:[1,2.5],cA:[0,.1],cD:[1.5,3.5],cS:[0,1.5],cR:[1.5,4],lr:[1,3],la:[0,1],ld:'index',sp:[2,6],ct:[5,8]},
  keys:{cls:[[.55,'twin'],[.45,'stack']],rm1:[1,14,7],rm2:[1,14],rm3:[1,2],i1:[2,4.5],i2:[1,3],i3:[1,2],fb:[0,1.5],det:[1,3],
    mA:[0,.2],mD:[2,4],mS:[0,2],mR:[1.5,3.5],cA:[0,.1],cD:[4,7],cS:[3,6],cR:[2,4.5],lr:[2,4],la:[0,1],ld:'index',sp:[2,5],ct:[5,8]},
  drone:{cls:[[.4,'deep'],[.35,'twin'],[.25,'add']],rm1:[.5,1,1.5,2.5,3.5],rm2:[.5,1,2,3],rm3:[1,1.5,2],i1:[3,7],i2:[3,6],i3:[2,5],fb:[2,5],det:[2,6],
    mA:[6,9],mD:[6,9],mS:[6,9],mR:[6,9],cA:[6,9.5],cD:[6,9],cS:[8,10],cR:[7,10],lr:[.5,2],la:[1.5,4],ld:'index',sp:[6,9.5],ct:[4,7]},
  fx:{cls:[[.6,'deep'],[.4,'twin']],rm1:[1.5,2.5,3.5,4.5,5.5,7.5,9.5],rm2:[1.5,2.5,3.5,5.5,7.5],rm3:[2.5,3.5,6.5],i1:[6,10],i2:[5,9],i3:[4,8],fb:[4,8],det:[2,6],
    mA:[3,7],mD:[4,8],mS:[4,8],mR:[4,8],cA:[3,7],cD:[4,8],cS:[6,9],cR:[5,9],lr:[4,8],la:[3,6],ld:'index',sp:[4,8],ct:[3,6]}
};
function genFM(type,gi,seed,opts,syn,locked,cur){
  const R=FMR[type];opts=opts||{};seed=seed>>>0;
  const bias=k=>((opts[k]==null?5:opts[k])-5)/10;
  const rnd=mulberry32((Math.imul(seed+1,2654435761)^Math.imul(gi+1,0x85ebca6b))>>>0);
  const pick=(r,b)=>{const u=clampN(rnd()+(b||0),0,1);return r[0]+u*(r[1]-r[0]);};
  const choose=l=>l[Math.floor(rnd()*l.length)];
  const weighted=pairs=>{const t=pairs.reduce((s,q)=>s+q[0],0);let r=rnd()*t;for(const [w,v] of pairs){if((r-=w)<=0)return v;}return pairs[pairs.length-1][1];};
  const bB=bias('brightness'),bM=bias('movement'),bG=bias('grit'),bS=bias('space');
  const fx={cls:weighted(R.cls),rc:1,rm1:choose(R.rm1),rm2:choose(R.rm2),rm3:choose(R.rm3),
    i1:pick(R.i1,bB),i2:pick(R.i2,bB),i3:pick(R.i3,bB*.6),fb:pick(R.fb,bG),det:pick(R.det,bM*.5),
    mE:{a:pick(R.mA),d:pick(R.mD),s:pick(R.mS),r:pick(R.mR)},cE:{a:pick(R.cA),d:pick(R.cD),s:pick(R.cS),r:pick(R.cR,bS*.5)}};
  const p={fx,
    osc1Shape:fx.i1,osc2Shape:fx.i2,osc2Pitch:5,sync:false,fm:fx.fb,mixOsc1:8,mixOsc2:5,mixSub:fx.fb,mixNoise:0,
    cutoff:pick(R.ct,bB),reso:pick([0,2]),drive:pick([0,2],bG),filterEnvAmt:5,
    filterEnv:fx.mE,ampEnv:fx.cE,lfo:{shape:'triangle',rate:pick(R.lr,bM),amount:pick(R.la,bM),dest:R.ld},
    reverb:pick(R.sp,bS),vintage:pick([1,5]),glide:0,unison:'off'};
  const W=WORDS[type],name=choose(W.a)+' '+choose(W.n);
  return pack(type,gi,seed,opts,applyLocks(p,cur&&cur.params,locked),name,syn);
}
const isFM=s=>!!(typeof SYN!=='undefined'&&SYN[s]&&SYN[s].kind==='fm');

/* Locks: a locked group keeps its values from the card on screen when rolling or mutating.
   Groups are abstract (osc / filter / env / lfo / fx), so a lock also carries across synths of the same family. */
const LOCKG={osc:['osc1Shape','osc2Shape','osc2Pitch','sync','fm','mixOsc1','mixOsc2','mixSub','mixNoise'],filt:['cutoff','reso','drive','filterEnvAmt'],env:['filterEnv','ampEnv'],lfo:['lfo'],fx:['reverb','vintage','glide','unison']};
const FXOSC=['cls','rc','rm1','rm2','rm3','i1','i2','i3','fb','det'];
function applyLocks(n,c,L){
  if(!n||!c||!L)return n;const fm=!!n.fx;if(fm!==!!c.fx)return n;const cl=v=>JSON.parse(JSON.stringify(v));
  for(const g in L){if(!L[g]||!LOCKG[g])continue;LOCKG[g].forEach(k=>{if(c[k]!==undefined)n[k]=cl(c[k]);});if(fm&&g==='osc')FXOSC.forEach(k=>{if(c.fx[k]!==undefined)n.fx[k]=c.fx[k];});}
  if(fm){if(L.env){n.fx.mE=cl(c.fx.mE);n.fx.cE=cl(c.fx.cE);}n.filterEnv=n.fx.mE;n.ampEnv=n.fx.cE;n.osc1Shape=n.fx.i1;n.osc2Shape=n.fx.i2;n.fm=n.mixSub=n.fx.fb;}
  return n;}

function pack(type,gi,seed,opts,p,name,syn){
  roundAll(p);
  const pat={genre:type,type,seed,synth:syn,id:mkCode(gi,seed,opts,syn),name,params:p,bpm:128,sw:0,key:'',disp:f1(p.cutoff),rs:f1(p.reso)};
  pat.tracks=matrix(p);
  return pat;
}

function gen(genre,seed,opts,locked,cur,syn){
  syn=syn||'T5';
  if(isFM(syn)){const g=Math.max(0,GENRES.indexOf(genre));return genFM(GENRES[g],g,seed,opts,syn,locked,cur);}
  const gi=Math.max(0,GENRES.indexOf(genre)),type=GENRES[gi],R=RULES[type];
  opts=opts||{};seed=seed>>>0;
  const bias=k=>((opts[k]==null?5:opts[k])-5)/10;
  const rnd=mulberry32((Math.imul(seed+1,2654435761)^Math.imul(gi+1,0x85ebca6b))>>>0);
  const pick=(r,b)=>{const u=clampN(rnd()+(b||0),0,1);return r[0]+u*(r[1]-r[0]);};
  const choose=l=>l[Math.floor(rnd()*l.length)];
  const weighted=pairs=>{const total=pairs.reduce((s,q)=>s+q[0],0);let r=rnd()*total;for(const [w,v] of pairs){if((r-=w)<=0)return v;}return pairs[pairs.length-1][1];};
  const bB=bias('brightness'),bM=bias('movement'),bG=bias('grit'),bS=bias('space');
  const p={
    osc1Shape:pick(R.osc1Shape),osc2Shape:pick(R.osc2Shape),osc2Pitch:pick(R.osc2Pitch),
    sync:rnd()<R.sync,fm:pick(R.fm,bG),
    mixOsc1:pick(R.mixOsc1),mixOsc2:pick(R.mixOsc2),mixSub:pick(R.mixSub),mixNoise:pick(R.mixNoise,bG),
    cutoff:pick(R.cutoff,bB),reso:pick(R.reso,bG*.6),drive:pick(R.drive,bG),
    filterEnvAmt:5+pick(R.envAmt,bM*.5),
    filterEnv:{a:pick(R.fA),d:pick(R.fD),s:pick(R.fS),r:pick(R.fR)},
    ampEnv:{a:pick(R.aA),d:pick(R.aD),s:pick(R.aS),r:pick(R.aR,bS*.5)},
    lfo:{shape:choose(R.lfoShapes),rate:pick(R.lfoRate,bM)},
    reverb:pick(R.reverb,bS),vintage:pick(R.vintage),glide:pick(R.glide),
    unison:weighted(R.unison)
  };
  const [dest,range]=choose(R.lfoDest);
  p.lfo.dest=dest;p.lfo.amount=pick(range,bM);
  const W=WORDS[type],name=choose(W.a)+' '+choose(W.n);
  return pack(type,gi,seed,opts,fix(applyLocks(p,cur&&cur.params,locked)),name,syn);
}

function mutate(pat,locked,seed,amt){
  const rnd=mulberry32(Math.imul((seed>>>0)+1,2654435761)>>>0);
  const p=JSON.parse(JSON.stringify(pat.params));
  const nudge=o=>{for(const k in o){if(k==='cls'||k==='rc'||k==='rm1'||k==='rm2'||k==='rm3')continue;if(typeof o[k]==='number')o[k]+=(rnd()-.5)*(amt||1.4);else if(o[k]&&typeof o[k]==='object')nudge(o[k]);}};
  nudge(p);applyLocks(p,pat.params,locked);if(!p.fx)fix(p);else{p.osc1Shape=p.fx.i1;p.osc2Shape=p.fx.i2;p.fm=p.mixSub=p.fx.fb;p.filterEnv=p.fx.mE;p.ampEnv=p.fx.cE;}roundAll(p);
  const n=Object.assign({},pat,{params:p,seed,mut:true,disp:f1(p.cutoff),rs:f1(p.reso)});
  n.tracks=matrix(p);
  return n;
}
function ensurePat(p){if(!p.synth)p.synth='T5';if(!p.tracks||!p.tracks[0]||!p.tracks[0].steps)p.tracks=matrix(p.params);if(p.bpm==null)p.bpm=128;if(p.disp==null)p.disp=f1(p.params.cutoff);if(p.rs==null)p.rs=f1(p.params.reso);return p;}

const junoView=(pre,pwm,extraHead)=>p=>{const q=p.params,ty=kinds(p),mono=isMono(ty),saw=q.osc1Shape<=6||q.osc2Shape>5,sq=q.osc1Shape>4,ch=q.vintage>5?'I+II':q.vintage>2?'II':'I';
  const rails=[
    {k:'knobs',name:'DCO',sub:'RANGE '+(mono?"16'":"8'"),items:[['LFO',lfoOn(q)?0:q.lfo.amount*.6],[pwm,sq?q.osc1Shape:3],['SUB',q.mixSub],['NOISE',q.mixNoise]]},

    {k:'cab',name:'LFO',items:[['RATE',q.lfo.rate],['DELAY',q.lfo.amount*.5]],cables:lfoCab(q,lfoOn(q)?'VCF':'DCO / PWM')}];

/* ---------- FM family: the same abstract FM recipe (p.fx) mapped onto each FM panel ---------- */
const mkF=(o)=>{o.kind='fm';return o;};
const FM_NOTE={ru:'Режим FM. Значения 0–10 — положения ручек, у Digitone II значения как на экране (0–127). Отношения частот (ratio) показаны числами. Номер алгоритма подобран по описанию структуры, проверьте схему на экране синтезатора. Код сида даёт ту же карточку на любом устройстве.',
  en:'FM mode. Values 0-10 are knob positions; Digitone II values are as on its screen (0-127). Frequency ratios are shown as numbers. The algorithm number is picked by structure, check the diagram on the synth screen. A seed code gives the same card on any device.'};
const rt=r=>String(Math.round(r*100)/100);
const rpos=r=>clampN(5+Math.log2(Math.max(.125,r))*1.6);
const s127=v=>String(Math.round(clampN(v)*12.7));
const s99=v=>String(Math.round(clampN(v)*9.9));
const lfoF=q=>[{l:'LFO · '+String(q.lfo.shape).toUpperCase(),r:q.lfo.dest==='pitch'?'PITCH':'OP INDEX',amt:q.lfo.amount}];
/* six operators laid out like DX7 alg 5 / 1 / 32: ratio, level, role */
const ops6=fx=>{const O=(r,lv,role)=>({r,lv,role}),off=()=>O(1,0,'off'),c=fx.cls,rc=fx.rc;
  if(c==='add')return [1,2,3,4,5,6].map(k=>O(rc*k,Math.max(1.2,9-k*1.3),'car'));
  const a=[O(rc,9,'car'),O(fx.rm1,fx.i1,'mod')];
  if(c==='stack')return a.concat([off(),off(),off(),off()]);
  if(c==='twin')return a.concat([O(rc,8,'car'),O(fx.rm2,fx.i2,'mod'),off(),off()]);
  return a.concat([O(rc,8,'car'),O(fx.rm2,fx.i2,'mod'),O(fx.rm3,fx.i3,'mod'),O(fx.rm3,fx.i3*.7,'mod')]);};
const dx7Alg=c=>c==='add'?[32,'all six operators are carriers']:c==='deep'?[1,'2>1 and a 6>5>4>3 chain']:c==='twin'?[5,'three 2-op stacks, two used']:[5,'2-op stack, other stacks muted'];
const ops4=fx=>{const O=(r,lv,role)=>({r,lv,role}),off=()=>O(1,0,'off'),c=fx.cls,rc=fx.rc;
  if(c==='add')return [1,2,3,4].map(k=>O(rc*k,Math.max(1.5,9-k*1.8),'car'));
  if(c==='deep')return [O(rc,9,'car'),O(fx.rm1,fx.i1,'mod'),O(fx.rm2,fx.i2,'mod'),O(fx.rm3,fx.i3,'mod')];
  return [O(rc,9,'car'),O(fx.rm1,fx.i1,'mod'),off(),off()];};
const fmHead=(q,ex)=>`${ex} · FB ${f1(q.fx.fb)} · ${q.fx.cls.toUpperCase()}`;
const opRails=(ops,n)=>[
  {k:'knobs',name:'RATIO',sub:'OP 1-'+n+' · '+ops.map(o=>o.role==='car'?'C':o.role==='mod'?'M':'-').join(' '),items:ops.map((o,i)=>['OP '+(i+1),o.role==='off'?0:rpos(o.r),o.role==='off'?'-':rt(o.r)])},
  {k:'knobs',name:'LEVEL',sub:'carrier = volume, modulator = FM amount',items:ops.map((o,i)=>['OP '+(i+1),o.lv,s99(o.lv)])}];

SYN.DT=mkF({name:'ELEKTRON DIGITONE II',short:'DIGITONE II',note:FM_NOTE,
  view(p){const q=p.params,fx=q.fx,ty=kinds(p),algo=fx.cls==='deep'?1:2,harm=Math.round((fx.i3-2.5)*3.6),fe=fx.mE,ce=fx.cE;

function dotLines(lines,pt,r,cls){

/* Patch Companion voice: soft rubber detents of a pot, relay-free. Keys are low "tocks", rolling a card
   closes and reopens a resonant low-pass, saving is a two-note blip, the boot is a real filter sweep. */
const SND={
  ctx:null,master:null,noiseBuf:null,bus:null,on:true,
  init(){
    if(this.ctx)return true;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;
      try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
      const c=new AC(),ws=c.createWaveShaper(),cv=new Float32Array(2048);

/* ---------- filter model: shared by the header window and the boot ---------- */
function envFn(e,G){
  const A=.05+e.a/10*.55,D=.08+e.d/10*.6,S=e.s/10,R=.15+e.r/10*.7;
  const lvl=t=>t<A?t/A:t<A+D?1-(1-S)*((t-A)/D):S;
  const f=t=>{if(t<=0)return 0;if(t<G)return lvl(t);const k=(t-G)/R;return k>=1?0:lvl(G)*(1-k);};
  return {f,A,D,G,R,S};
}
function effCut(q,env){const amt=Math.max(.55,(q.filterEnvAmt-5)/5),b0=q.cutoff*.35,pk=Math.min(10,q.cutoff+(10-q.cutoff)*amt+1.2);return b0+(pk-b0)*env;}
function lpResp(u,uc,rs){const g=1/Math.sqrt(1+Math.pow(2,56*(u-uc))),x=(u-uc)/.035;return g+rs/10*1.15*Math.exp(-x*x)*(u<uc+.12?1:0);}
function drawFilt(cx,W,H,o){
  const P=o.pad==null?10:o.pad,bh=o.trail?Math.round(H*.26):0,top=P+(o.top||0),bot=H-P-bh-(o.trail?6:0),w=W-2*P,uc=.12+.78*o.eff/10;
  cx.clearRect(0,0,W,H);
  cx.fillStyle=o.dim;
  for(let i=0;i<=10;i++){cx.globalAlpha=i%5?.28:.5;const x=P+w*i/10,h=i%5?3:6;cx.fillRect(Math.round(x)-.5,bot+1,1,h);}
  cx.globalAlpha=.25;cx.fillRect(P,bot,w,1);
  const N=Math.max(24,Math.round(w/2)),pts=[];
  for(let k=0;k<=N;k++){const u=k/N,y=Math.min(2,lpResp(u,uc,o.reso));pts.push([P+w*u,bot-(y/2)*(bot-top)]);}
  cx.beginPath();cx.moveTo(P,bot);pts.forEach(p=>cx.lineTo(p[0],p[1]));cx.lineTo(P+w,bot);cx.closePath();
  cx.globalAlpha=.2;cx.fillStyle=o.lamp;cx.fill();
  cx.globalAlpha=1;cx.beginPath();pts.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));
  cx.strokeStyle=o.ink;cx.lineWidth=o.lw||2;cx.lineJoin='round';cx.stroke();
  const ux=P+w*uc;cx.globalAlpha=.6;cx.strokeStyle=o.lamp;cx.lineWidth=1;cx.setLineDash([2,3]);cx.beginPath();cx.moveTo(ux,top);cx.lineTo(ux,bot);cx.stroke();cx.setLineDash([]);
  cx.globalAlpha=1;
  if(o.trail){
    const b0=H-P,n=o.trail.length,upto=Math.min(n-1,o.idx==null?n-1:o.idx);
    cx.globalAlpha=.25;cx.fillStyle=o.dim;cx.fillRect(P,b0,w,1);
    cx.globalAlpha=1;cx.beginPath();
    for(let i=0;i<=upto;i++){const x=P+w*i/(n-1),y=b0-(o.trail[i]/10)*(bh-2);i?cx.lineTo(x,y):cx.moveTo(x,y);}
    cx.strokeStyle=o.lamp;cx.lineWidth=2;cx.stroke();
    const x=P+w*upto/(n-1),y=b0-(o.trail[upto]/10)*(bh-2);cx.fillStyle=o.lamp;cx.beginPath();cx.arc(x,y,3,0,7);cx.fill();
  }
}

  try{localStorage.setItem('pt-skin',sk);}catch(e){}
  $('#skinBtn').title=t('theme_t')+': '+t('sk_'+sk);
  if(notify)toast(t('theme_t')+': '+t('sk_'+sk));

/* ---------- modes ---------- */
const POS={gen:25,sav:75};
function show(m){
  state.mode='gen';
  $('#p-gen').hidden=false;
  $$('.bar [data-a=mode]').forEach(b=>b.setAttribute('aria-pressed','true'));
  $$('.dial .dl').forEach(l=>l.classList.toggle('on',l.dataset.m==='gen'));
  $('#dial').style.setProperty('--pos',POS.gen+'%');

/* ---------- fire (go button): the old pattern is wiped column by column, then the new one is written step by step ---------- */
let busy=false;
const COL=44; /* ms per step, keep in sync with the CSS animation delays */
function fire(btn,o,fn){
  if(busy)return;busy=true;
  $('#lamp').classList.add('on');$('#dial').classList.add('scan');
  if(btn)btn.classList.add('busy');
  const sh=o&&$('.sheet',o);
  if(sh&&!RM){sh.classList.remove('wr');sh.classList.add('er');SND.seqErase();}
  if(btn&&!RM){
    let sq=btn.querySelector('.seq');
    if(!sq){sq=document.createElement('span');sq.className='seq';sq.setAttribute('aria-hidden','true');sq.innerHTML='<i></i>'.repeat(16);btn.appendChild(sq);}
    const st=[...sq.children];st.forEach(x=>x.classList.remove('on'));
    const go=()=>st.forEach((x,i)=>setTimeout(()=>{st.forEach(y=>y.classList.remove('on'));x.classList.add('on');},300+i*COL));
    go();
    setTimeout(()=>st.forEach(y=>y.classList.remove('on')),300+16*COL+60);
  }
  setTimeout(()=>{
    fn();SND.seqWrite(state.pat);
    const oo=out(),stick=$('.stick'),sh2=stick?stick.offsetHeight:0;
    if(oo){const top=oo.getBoundingClientRect().top;if(top>innerHeight*.6||top<sh2)window.scrollTo({top:Math.max(0,scrollY+top-12-sh2),behavior:RM?'auto':'smooth'});}
  },RM?0:300);
  setTimeout(()=>{$('#lamp').classList.remove('on');$('#dial').classList.remove('scan');if(btn)btn.classList.remove('busy');busy=false;},RM?30:300+16*COL+320);
}

    const pat=state.pat||(demo||(demo=gen('pad',1234,{},null,null))),q=pat.params;

/* ---------- fidget: a big cutoff knob and an XY filter pad. Hold = a saw note through the low-pass ---------- */
const FID={open:false,cut:5,res:2,m:'cab',on:false,v:null,cables:[],envT:0,mcut:4,raf:0};
SND.fidOn=function(){
  if(!this.ok()||FID.v)return;
  const c=this.ctx,t=c.currentTime,notes=[82.41,98,110,123.47,146.83],f=notes[Math.floor(Math.random()*notes.length)];
  const a=c.createOscillator(),b=c.createOscillator(),s=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();
  a.type=b.type='sawtooth';a.frequency.value=f;b.frequency.value=f*1.5;b.detune.value=6;s.type='square';s.frequency.value=f/2;
  lp.type='lowpass';g.gain.value=.0001;
  a.connect(lp);b.connect(lp);s.connect(lp);lp.connect(g);g.connect(this.master);
  [a,b,s].forEach(o=>o.start(t));
  FID.v={o:[a,b,s],lp,g};this.fidSet();
  g.gain.setTargetAtTime(.1,t,.02);
};
SND.fidSet=function(){
  const v=FID.v;if(!v||!this.ctx)return;const t=this.ctx.currentTime;
  v.lp.frequency.setTargetAtTime(90*Math.pow(2,FID.cut*.68),t,.025);
  v.lp.Q.setTargetAtTime(1+FID.res*1.9,t,.03);
};
SND.fidOff=function(){
  const v=FID.v;if(!v||!this.ctx)return;FID.v=null;const t=this.ctx.currentTime;
  v.g.gain.setTargetAtTime(.0001,t,.05);
  setTimeout(()=>v.o.forEach(o=>{try{o.stop();}catch(e){}}),400);
};

/* cable patch voice: a saw drone through a low-pass; patching a source (LFO / ENV / OSC / NOISE) into a destination (CUT / PITCH / AMP / REV) really modulates it */
const CSRC=['LFO','ENV','OSC','NOISE'],CDST=['CUT','PITCH','AMP','REV'],CCOL=['#E8461B','#C9B27A','#3E7F86','#2B2D2A'];
const CSC=[[1800,35,.045,.35],[3300,400,.16,.5],[900,250,.05,.25],[700,30,.04,.3]]; /* source x destination: cents, cents, gain, gain */
SND.cabStart=function(){
  if(!this.ok()||this.cab)return;
  const c=this.ctx,t=c.currentTime,f=82.41,N={};
  const mk=(type,fr)=>{const o=c.createOscillator();o.type=type;o.frequency.value=fr;return o;};
  const a=mk('sawtooth',f),b=mk('sawtooth',f*1.5),sb=mk('square',f/2);b.detune.value=6;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=594;lp.Q.value=5;

/* ---------- boot screen: the filter opens. The patch's own filter envelope (A D S R) sweeps a low-pass on screen and through a real saw voice ---------- */
function runBoot(){
  const el=$('#boot'),dev=$('.device');if(!el)return;
  const pat=gen(GENRES[Math.floor(Math.random()*GENRES.length)],Math.floor(Math.random()*MAXSEED),{},null,null),q=pat.params;
  const G=1.6,E=envFn(q.filterEnv,G),T=G+E.R+.1,TL=G+E.R+.1,BTOTAL=TL+.8,NS=140;
  const trail=[],amp=[];
  for(let i=0;i<NS;i++){const tt=i/(NS-1)*T;trail.push(effCut(q,E.f(tt)));amp.push(tt<G?1:Math.max(0,1-(tt-G)/E.R));}
  const cv=$('#btScope'),cx=cv.getContext('2d'),big=$('#btBig'),st=$('#btSt'),pw=$('#btPwrT'),uR=$('#btU'),lamps=['A','D','S','R'].map(k=>$('#bl'+k));
  const setBig=s=>{big.innerHTML=dotSvg(s,4,1.6);big.setAttribute('aria-label',s);};
  setBig('0.0');
  let W=0,H=0,starting=false,started=false,ended=false,locked=false,tStart=0,auto=0,safety=0,lastF=-1;
  const setT=(node,key)=>{node.dataset.t=key;node.textContent=t(key);};
  try{dev.inert=true;}catch(e){}
  document.documentElement.style.overflow='hidden';
  function size(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;cv.width=Math.round(W*d);cv.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);paint(-1);}
  function paint(tt){
    const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--screen-ink').trim()||'#eee',dim=cs.getPropertyValue('--screen-dim').trim()||'#999',lamp=cs.getPropertyValue('--lamp').trim()||'#E8461B';
    const tc=Math.max(0,Math.min(T,tt)),eff=effCut(q,E.f(tc)),idx=tt<0?0:Math.round(tc/T*(NS-1));
    drawFilt(cx,W,H,{eff:tt<0?q.cutoff:eff,reso:q.reso,ink,dim,lamp,trail,idx,pad:12});
    if(tt>=0&&!locked){
      const stg=tt<E.A?0:tt<E.A+E.D?1:tt<G?2:3;
      lamps.forEach((l,i)=>l.classList.toggle('lit',tt>=0&&tt<T&&i===stg));
      const n=Math.round(eff*10)/10;if(n!==lastF){lastF=n;setBig(n.toFixed(1));}
    }
  }
  function lock(){
    locked=true;el.classList.add('lock');
    lamps.forEach(l=>l.classList.add('lit'));
    setBig(MARK);uR.textContent=String(pat.genre).toUpperCase();setT(st,'boot_lock');
  }
  function finish(){
    if(ended)return;ended=true;
    clearTimeout(auto);clearTimeout(safety);
    window.removeEventListener('keydown',onKey,true);window.removeEventListener('resize',size);
    SND.bootStop();
    el.classList.add('out');
    try{dev.inert=false;}catch(e){}
    dev.removeAttribute('inert');
    document.documentElement.style.overflow='';
    window.scrollTo(0,0);
    setTimeout(()=>{el.remove();},700);
  }
  function frame(now){
    if(ended)return;
    const tt=(now-tStart)/1000;

    paint(locked?T:tt);
    if(tt>=BTOTAL){finish();return;}
    requestAnimationFrame(frame);
  }

    started=true;clearTimeout(auto);
    safety=setTimeout(finish,12000);
    el.classList.add('on','run');
    setT(pw,'boot_skip');setT(st,'boot_wr');
    if(RM){paint(T);lock();setTimeout(finish,700);return;}
    const go=()=>{try{SND.bootRun(trail,amp,T,q.reso,TL);}catch(e){}};
    if(SND.ok())go();
    else if(SND.on&&SND.ctx){try{SND.ctx.resume().then(()=>{if(!ended&&SND.ok())go();}).catch(()=>{});}catch(e){}}

    requestAnimationFrame(frame);
  }

    if(ended)return;
    if(started){if(performance.now()-tStart>600)finish();return;}
    if(starting)return;
    starting=true;
    SND.unlock();
    let done=false;
    const go=()=>{if(done)return;done=true;begin();};
    if(SND.on&&SND.ctx&&SND.ctx.state!=='running'){

    if(e.key==='Escape'){if(started)finish();else start();return;}

  }

  window.addEventListener('resize',size);
  auto=setTimeout(()=>{if(!started&&!starting&&(!SND.on||SND.ok())){starting=true;begin();}},2800);
  try{$('#btPwr').focus({preventScroll:true});}catch(e){}
  size();
}
